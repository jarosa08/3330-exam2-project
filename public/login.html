<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceHub</title>
    <!-- images from magnific -->
    <!-- css done with assitance of ai -->
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>
</head>

<body>
    <header>
        <div class="main-menu">
            <button class="menu-button"><b>MENU</b></button>
        </div>

        <div>
            <h1 class="site-name">RACEHUB</h1>
        </div>

        <div class="account-info">
            <p class="account-type">GUEST</p>
            <button><b>LOG IN</b></button>
        </div>
    </header>
    <nav class="header-links">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Races</a></li>
            <li><a href="#">Pace Calculator</a></li>
            <li><a href="#">Account</a></li>
        </ul>
    </nav>

    <main>
        <h2>Log In - Register Page</h2>

        <div class="account-form">

            <form>
                <div class="account-buttons">
                    <button type="button" class="log-in-button">LOG IN</button>
                    <button type="button" class="register-button">REGISTER</button>
                </div>

                <div class="first-name register">
                    <label for="form-first-name">First Name:</label>
                    <input type="text" id="first-name-input" name="first-name-input" required>
                </div>
            
                <div class="last-name register">
                    <label for="form-last-name">Last Name:</label>
                    <input type="text" id="last-name-input" name="last-name-input" required>    
                </div>
            
                <div class="DOB register">
                    <label for="form-DOB">Date of Birth:</label>
                    <input type="date" id="DOB-input" name="DOB-input" required>
                </div>

                <div class="gender">
                    <label for="form-gender" class="register">Gender</label>
                    <label for="form-male" class="register">Male</label>

                    <input type="radio" id="male-input" name="male-input" class="register" value="male" required>

                    <label for="form-female" class="register">Female</label>
                    <input type="radio" id="female-input" name="female-input" class="register" value="female">
                </div>

                <div class="email log-in">
                    <label for="form-email">Email:</label>
                    <input type="email" id="email-input" name="email-input" required>
                </div>

                <div class="password log-in">
                    <label for="form-password">Password:</label>
                    <input type="password" id="password-input" name="password-input" required>
                </div>

                <div class="continue">
                    <button>CONTINUE</button>
                </div>
            </form>
        </div>
    </main>
    
         <!-- footer section -->
    <footer>
        <nav class="footer-links">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Races</a></li>
                <li><a href="#">Pace Calculator</a></li>
                <li><a href="#">Account</a></li>
            </ul>
        </nav>
    </footer>
    <!-- include js -->
    <script src="js/calculator.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
